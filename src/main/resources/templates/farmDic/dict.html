<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>농업용어사전 - AGRIWATCH</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/crop.css}">

    <link rel="stylesheet"
          th:href="@{/css/dict.css}">

</head>


<body>


<!-- =====================================================
     헤더
     ===================================================== -->

<header class="crop-header">

    <div class="crop-header-inner">


        <!-- =================================================
             로고
             ================================================= -->

        <a th:href="@{/main/view}"
           class="crop-header-logo">

            <img th:src="@{/img/logo.png}"
                 alt="AGRIWATCH">

            <span class="crop-header-logo-text">
                AGRIWATCH
            </span>

        </a>


        <!-- =================================================
             메뉴
             ================================================= -->

        <nav class="crop-nav">

            <a th:href="@{/crop/region}"
               class="crop-nav-item">
                🌱 재배 분석
            </a>


            <a th:href="@{/diag/ImgTrans}"
               class="crop-nav-item">
                🔍 AI 병충해 진단
            </a>


            <a th:href="@{/trade/view}"
               class="crop-nav-item">
                🛒 작물 거래
            </a>


            <a th:href="@{/farmDic/view}"
               class="crop-nav-item active">
                📖 농업용어사전
            </a>

        </nav>


        <!-- =================================================
             사용자
             ================================================= -->

        <div class="crop-header-user">

            <span class="header-username"
                  th:text="${session.userName} + '님'">
                사용자님
            </span>


            <a th:href="@{/mypage/view}"
               class="crop-nav-item">
                마이페이지
            </a>

        </div>

    </div>

</header>


<!-- =====================================================
     농업용어사전 메인
     ===================================================== -->

<main class="dict-main">

    <div class="dict-inner">


        <!-- =====================================================
             페이지 제목
             ===================================================== -->

        <div class="dict-page-title">

            <h1 class="dict-title">
                농업용어사전
            </h1>

            <p class="dict-subtitle">
                농업과 관련된 용어를 쉽고 빠르게 찾아보세요.
            </p>

        </div>


        <!-- =====================================================
             검색
             ===================================================== -->

        <section class="dict-search-section">

            <div class="dict-search-box">

                <div class="dict-search-form">

                    <input type="text"
                           id="dictSearchInput"
                           class="dict-search-input"
                           placeholder="검색할 농업 용어를 입력해주세요."
                           autocomplete="off">


                    <button type="button"
                            id="dictSearchBtn"
                            class="dict-search-btn">
                        검색
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================================
             검색 결과
             ===================================================== -->

        <section class="dict-result-section">


            <!-- =================================================
                 검색 결과 상단
                 ================================================= -->

            <div class="dict-result-header">

                <h2 class="dict-result-title">
                    검색 결과
                </h2>


                <span class="dict-result-count">

                    불러온 용어

                    <strong id="dictResultCount">
                        0
                    </strong>

                    건

                </span>

            </div>


            <!-- =================================================
                 검색 전 / 검색 결과 없음
                 ================================================= -->

            <div id="dictResultEmpty"
                 class="dict-result-empty">

                검색어를 입력하면 관련 농업 용어가 표시됩니다.

            </div>


            <!-- =================================================
                 검색 결과 목록
                 JS에서 생성
                 ================================================= -->

            <div id="dictResultList"
                 class="dict-result-list">
            </div>


            <!-- =================================================
                 페이지네이션
                 JS에서 생성
                 ================================================= -->

            <div id="dictPagination"
                 class="dict-pagination">
            </div>


        </section>


    </div>

</main>


<!-- =====================================================
     농업용어 상세 모달
     ===================================================== -->

<div id="dictDetailModal"
     class="dict-detail-modal"
     hidden>


    <!-- =================================================
         모달 배경
         ================================================= -->

    <div id="dictDetailBackdrop"
         class="dict-detail-backdrop">
    </div>


    <!-- =================================================
         상세 영역
         기존 상세 디자인 클래스 유지
         ================================================= -->

    <section id="dictDetailSection"
             class="dict-detail-section"
             role="dialog"
             aria-modal="true"
             aria-labelledby="dictDetailWord">


        <!-- =================================================
             닫기 버튼
             ================================================= -->

        <button type="button"
                id="dictDetailCloseBtn"
                class="dict-detail-close-btn"
                aria-label="용어 설명 닫기">
            ×
        </button>


        <!-- =================================================
             상세 제목
             ================================================= -->

        <div class="dict-detail-header">

            <span class="dict-detail-label">
                농업용어
            </span>


            <h2 id="dictDetailWord"
                class="dict-detail-word">
            </h2>

        </div>


        <!-- =================================================
             상세 설명
             ================================================= -->

        <div class="dict-detail-content">

            <p id="dictDetailDescription"
               class="dict-detail-description">
            </p>

        </div>


    </section>

</div>


<!-- =====================================================
     Context Path
     ===================================================== -->

<script th:inline="javascript">

    const CTX = /*[[@{/}]]*/ '/';

</script>


<!-- =====================================================
     농업용어사전 JavaScript
     ===================================================== -->

<script th:src="@{/js/dict.js}">
</script>


</body>

</html>
