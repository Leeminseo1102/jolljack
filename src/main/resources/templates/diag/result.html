<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 병충해 진단 결과</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/crop.css}">
    <link rel="stylesheet" th:href="@{/css/diagResult.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
</head>
<body>

<!-- 일반 진입 헤더 -->
<header class="crop-header" th:if="${reportMode != true}">
    <div class="crop-header-inner">

        <a th:href="@{/main/view}" class="crop-header-logo">
            <img th:src="@{/img/logo.png}" alt="AGRIWATCH">
            <span class="crop-header-logo-text">AGRIWATCH</span>
        </a>

        <nav class="crop-nav">
            <a th:href="@{/crop/region}" class="crop-nav-item">
                🌱 재배 분석
            </a>
            <a th:href="@{/diag/ImgTrans}" class="crop-nav-item active">
                🔍 AI 병충해 진단
            </a>
        </nav>

        <div class="crop-header-user">
            <span class="header-username" th:text="${session.userName} + '님'">사용자님</span>
            <a th:href="@{/mypage/view}" class="crop-nav-item">마이페이지</a>
        </div>

    </div>
</header>

<!-- 마이페이지 진입 헤더 -->
<header class="crop-header" th:if="${reportMode == true}">
    <div class="crop-header-inner">

        <a th:href="@{/mypage/view}" class="crop-header-logo">
            <img th:src="@{/img/logo.png}" alt="AGRIWATCH">
            <span class="crop-header-logo-text">AGRIWATCH</span>
        </a>

        <div class="crop-header-user">
            <span class="header-username" th:text="${session.userName} + '님'">사용자님</span>
        </div>

    </div>
</header>

<main class="diag-result-main">

    <section class="diag-result-section">
        <div class="diag-result-inner">

            <div class="diag-result-card">

                <div class="diag-title-wrap">
                    <h1 class="diag-title">AI 병충해 진단</h1>
                </div>

                <div class="diag-result-layout">

                    <!-- 왼쪽 카드 -->
                    <section class="diag-left-card">

                        <article class="diag-candidate-card">
                            <h2 class="diag-card-title">예상 진단명</h2>

                            <div id="candidateButtonWrap" class="diag-candidate-buttons">
                                <button type="button" class="diag-candidate-btn active">
                                    <span class="diag-candidate-name">진단명1</span>
                                    <span class="diag-candidate-percent">--%</span>
                                </button>
                            </div>
                        </article>

                        <article class="diag-reason-card">
                            <h2 class="diag-card-title">진단 이유</h2>

                            <div class="diag-reason-content">
                                <strong>내용</strong>
                                <p id="diagnosisReason">진단 결과를 불러오는 중입니다.</p>
                            </div>
                        </article>

                    </section>

                    <!-- 오른쪽 카드 -->
                    <aside class="diag-right-card">

                        <div class="diag-selected-box">
                            <span id="selectedDiseaseName" class="diag-selected-name">진단명</span>
                            <strong id="selectedPercent" class="diag-selected-percent">--%</strong>
                        </div>

                        <div class="diag-solution-area">
                            <h2 class="diag-solution-title">해결 방안</h2>
                            <p id="solutionText" class="diag-solution-content">
                                해결 방안을 불러오는 중입니다.
                            </p>
                        </div>

                        <div class="diag-prevention-area">
                            <h2 class="diag-solution-title">예방 방법</h2>
                            <p id="preventionText" class="diag-solution-content">
                                예방 방법을 불러오는 중입니다.
                            </p>
                        </div>

                        <button type="button"
                                id="btnDone"
                                class="diag-done-btn"
                                th:text="${reportMode == true} ? '마이페이지로' : '완료'">
                            완료
                        </button>

                    </aside>

                </div>

            </div>

        </div>
    </section>

</main>

<div th:replace="~{modal/modal :: commonModal}"></div>

<script th:inline="javascript">
    const CTX = /*[[@{/}]]*/ '/';
    const REPORT_MODE = /*[[${reportMode}]]*/ false;
    const DIAGNOSIS_ID = /*[[${diagnosisId}]]*/ null;
</script>

<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/diagResult.js}"></script>

</body>
</html>
