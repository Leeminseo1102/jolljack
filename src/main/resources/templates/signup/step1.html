<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 이메일 인증</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>

<div class="signup-wrapper">
    <div class="bg-circle-bottom"></div>

    <div class="signup-shell">
        <div class="signup-card">
            <div class="signup-card-top">
                <div class="signup-service-brand">
                    <img th:src="@{/img/logo.png}" alt="AgriWatch 로고" class="signup-service-logo">
                    <div class="signup-service-name">AGRIWATCH</div>
                </div>

                <h1 class="signup-title">회원가입</h1>
                <p class="signup-subtitle">이메일 인증을 진행해주세요</p>
            </div>

            <div class="step-indicator">
                <div class="step-item">
                    <div class="step-circle active">1</div>
                    <span class="step-label active">이메일 인증</span>
                </div>
                <div class="step-line"></div>
                <div class="step-item">
                    <div class="step-circle">2</div>
                    <span class="step-label">계정 정보</span>
                </div>
                <div class="step-line"></div>
                <div class="step-item">
                    <div class="step-circle">3</div>
                    <span class="step-label">지역 선택</span>
                </div>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" class="form-control" placeholder="이름을 입력해주세요" maxlength="50">
                <span id="nameMsg" class="msg-error"></span>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <div class="input-with-btn">
                    <input type="email" id="email" class="form-control" placeholder="이메일을 입력해주세요" maxlength="100">
                    <button type="button" id="btnSendCode" class="btn btn-primary btn-sm">전송</button>
                </div>
                <span id="emailMsg" class="msg-error"></span>
            </div>

            <div class="form-group code-area" id="codeArea" style="display: none;">
                <label for="inputCode">인증코드</label>
                <div class="input-with-btn">
                    <input type="text" id="inputCode" class="form-control" placeholder="인증코드 6자리를 입력해주세요" maxlength="6">
                    <button type="button" id="btnVerify" class="btn btn-primary btn-sm">확인</button>
                </div>
                <div class="code-status-row">
                    <span id="codeMsg" class="msg-error"></span>
                    <span id="codeTimer" class="msg-info"></span>
                </div>
            </div>

            <button type="button" id="btnNext" class="btn btn-primary btn-full" disabled>다음</button>

            <div class="signup-footer">
                이미 계정이 있으신가요? <a th:href="@{/login/form}">로그인</a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const CTX = /*[[@{/}]]*/ '/';
</script>
<script th:src="@{/js/signup-step1.js}"></script>

</body>
</html>
