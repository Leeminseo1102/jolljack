<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/findPassword.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
</head>
<body>

<div class="findpw-wrapper">
    <div class="bg-circle-bottom"></div>

    <div class="findpw-shell">
        <div class="findpw-card">

            <div class="findpw-card-top">
                <div class="findpw-service-brand">
                    <a th:href="@{/main/view}">
                        <img th:src="@{/img/logo.png}" alt="AgriWatch 로고" class="findpw-service-logo">
                    </a>
                    <div class="findpw-service-name">AGRIWATCH</div>
                </div>

                <h1 class="findpw-title">비밀번호 찾기</h1>
                <p class="findpw-subtitle">가입 시 등록한 정보와 이메일 인증으로 비밀번호를 재설정할 수 있습니다</p>
            </div>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" class="form-control" placeholder="가입 시 등록한 아이디를 입력해주세요" maxlength="20">
                <span id="loginIdMsg" class="msg-error"></span>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" class="form-control" placeholder="가입 시 등록한 이름을 입력해주세요" maxlength="50">
                <span id="nameMsg" class="msg-error"></span>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <div class="input-with-btn">
                    <input type="email" id="email" class="form-control" placeholder="가입 시 등록한 이메일을 입력해주세요" maxlength="100">
                    <button type="button" id="btnSendCode" class="btn btn-primary btn-sm">전송</button>
                </div>
                <span id="emailMsg" class="msg-error"></span>
            </div>

            <div class="form-group" id="codeArea" style="display:none;">
                <label for="inputCode">인증번호</label>
                <div class="input-with-btn">
                    <input type="text" id="inputCode" class="form-control" placeholder="인증번호 6자리를 입력해주세요" maxlength="6">
                    <button type="button" id="btnVerify" class="btn btn-primary btn-sm">확인</button>
                </div>
                <div class="code-status-row">
                    <span id="codeMsg" class="msg-error"></span>
                    <span id="codeTimer" class="msg-info"></span>
                </div>
            </div>

            <button type="button" id="btnConfirm" class="btn btn-primary btn-full" disabled>확인</button>

        </div>
    </div>
</div>

<div th:replace="~{modal/modal :: commonModal}"></div>

<script th:inline="javascript">
    const CTX = /*[[@{/}]]*/ '/';
</script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/findPassword.js}"></script>

</body>
</html>
