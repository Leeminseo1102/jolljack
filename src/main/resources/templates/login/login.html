<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-wrapper">
    <div class="bg-circle-bottom"></div>

    <div class="login-shell">
        <div class="login-card">

            <div class="login-card-top">
                <div class="login-service-brand">
                    <a th:href="@{/main/view}">
                        <img th:src="@{/img/logo.png}" alt="AgriWatch 로고" class="login-service-logo">
                    </a>
                    <div class="login-service-name">AGRIWATCH</div>

                </div>
                <h1 class="login-title">로그인</h1>
                <p class="login-subtitle">서비스를 이용하려면 로그인해주세요</p>
            </div>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" class="form-control" placeholder="아이디를 입력해주세요" maxlength="20">
                <span id="loginIdMsg" class="msg-error"></span>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력해주세요" maxlength="20">
                <span id="passwordMsg" class="msg-error"></span>
            </div>

            <span id="loginMsg" class="msg-error"></span>

            <button type="button" id="btnLogin" class="btn btn-primary btn-full">로그인</button>

            <div class="login-footer">
                <div class="login-links">
                    <a th:href="@{/find/id}">아이디 찾기</a>
                    <span class="divider">|</span>
                    <a th:href="@{/find/password}">비밀번호 찾기</a>
                    <span class="divider">|</span>
                    <a th:href="@{/signup/step1}">회원가입</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    const CTX = /*[[@{/}]]*/ '/';
</script>
<script th:src="@{/js/login.js}"></script>

</body>
</html>
